<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Director Dashboard - Announcements & Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .announcement-card, .event-card {
      transition: all 0.3s;
    }
    .announcement-card:hover, .event-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .nav-tabs .nav-link.active {
      background-color: #0d6efd;
      color: white;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-primary">Director Dashboard</h1>
      <div>
        <span class="badge bg-success me-2">Director Mode</span>
        <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>

    <ul class="nav nav-tabs mb-4" id="mainTabs">
      <li class="nav-item">
        <a class="nav-link active" data-bs-toggle="tab" href="#announcements">Announcements</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" href="#events">Events</a>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Announcements Tab -->
      <div class="tab-pane fade show active" id="announcements">
        <div class="card shadow mb-4">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Add New Announcement</h5>
          </div>
          <div class="card-body">
            <form id="announcementForm">
              <div class="row">
                <div class="col-md-8">
                  <div class="mb-3">
                    <label class="form-label">Announcement Title</label>
                    <input type="text" id="annTitle" class="form-control" required>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select id="annPriority" class="form-select">
                      <option value="normal">Normal</option>
                      <option value="important">Important</option>
                      <option value="urgent">Urgent</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Announcement Content</label>
                <textarea id="annContent" class="form-control" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Publish Announcement</button>
            </form>
          </div>
        </div>

        <h4 class="mb-3">Current Announcements</h4>
        <div id="announcementsList" class="row g-3"></div>
      </div>

      <!-- Events Tab -->
      <div class="tab-pane fade" id="events">
        <div class="card shadow mb-4">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Add New Event</h5>
          </div>
          <div class="card-body">
            <form id="eventForm">
              <div class="row">
                <div class="col-md-8">
                  <div class="mb-3">
                    <label class="form-label">Event Title</label>
                    <input type="text" id="eventTitle" class="form-control" required>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Date & Time</label>
                    <input type="datetime-local" id="eventDate" class="form-control" required>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Event Description</label>
                <textarea id="eventDesc" class="form-control" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" id="eventLocation" class="form-control">
              </div>
              <button type="submit" class="btn btn-primary">Add Event</button>
            </form>
          </div>
        </div>

        <h4 class="mb-3">Upcoming Events</h4>
        <div id="eventsList" class="row g-3"></div>
      </div>
    </div>
  </div>

  <!-- Success Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="successToast" class="toast" role="alert">
      <div class="toast-header bg-success text-white">
        <strong class="me-auto">Success</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (localStorage.getItem('isDirector') !== 'true') {
      window.location.href = 'index.html';
    }

    let announcements = JSON.parse(localStorage.getItem('announcements')) || [];
    let events = JSON.parse(localStorage.getItem('events')) || [];

    // Render Announcements
    function renderAnnouncements() {
      const container = document.getElementById('announcementsList');
      container.innerHTML = '';

      if (announcements.length === 0) {
        container.innerHTML = `<div class="col-12"><div class="alert alert-info">No announcements yet.</div></div>`;
        return;
      }

      announcements.forEach((ann, index) => {
        const priorityColor = 
          ann.priority === 'urgent' ? 'danger' : 
          ann.priority === 'important' ? 'warning' : 'primary';

        const card = document.createElement('div');
        card.className = `col-md-6 announcement-card`;
        card.innerHTML = `
          <div class="card h-100 border-${priorityColor}">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span class="badge bg-${priorityColor}">${ann.priority.toUpperCase()}</span>
              <small class="text-muted">${new Date(ann.date).toLocaleDateString()}</small>
            </div>
            <div class="card-body">
              <h5 class="card-title">${ann.title}</h5>
              <p class="card-text">${ann.content}</p>
            </div>
            <div class="card-footer">
              <button onclick="deleteAnnouncement(${index})" class="btn btn-danger btn-sm">Delete</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Render Events
    function renderEvents() {
      const container = document.getElementById('eventsList');
      container.innerHTML = '';

      if (events.length === 0) {
        container.innerHTML = `<div class="col-12"><div class="alert alert-info">No events scheduled yet.</div></div>`;
        return;
      }

      events.forEach((event, index) => {
        const card = document.createElement('div');
        card.className = `col-md-6 event-card`;
        card.innerHTML = `
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">${event.title}</h5>
              <p class="text-muted mb-2">
                <strong>Date:</strong> ${new Date(event.date).toLocaleString()}<br>
                <strong>Location:</strong> ${event.location || 'Not specified'}
              </p>
              <p class="card-text">${event.description}</p>
            </div>
            <div class="card-footer">
              <button onclick="deleteEvent(${index})" class="btn btn-danger btn-sm">Remove Event</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Add Announcement
    document.getElementById('announcementForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newAnn = {
        title: document.getElementById('annTitle').value,
        content: document.getElementById('annContent').value,
        priority: document.getElementById('annPriority').value,
        date: new Date().toISOString()
      };

      announcements.unshift(newAnn); // Add to top
      localStorage.setItem('announcements', JSON.stringify(announcements));
      
      showToast('Announcement published successfully!');
      this.reset();
      renderAnnouncements();
    });

    // Add Event
    document.getElementById('eventForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newEvent = {
        title: document.getElementById('eventTitle').value,
        description: document.getElementById('eventDesc').value,
        date: document.getElementById('eventDate').value,
        location: document.getElementById('eventLocation').value
      };

      events.unshift(newEvent);
      localStorage.setItem('events', JSON.stringify(events));
      
      showToast('Event added successfully!');
      this.reset();
      renderEvents();
    });

    // Delete functions
    function deleteAnnouncement(index) {
      if (confirm('Delete this announcement?')) {
        announcements.splice(index, 1);
        localStorage.setItem('announcements', JSON.stringify(announcements));
        renderAnnouncements();
        showToast('Announcement deleted');
      }
    }

    function deleteEvent(index) {
      if (confirm('Remove this event?')) {
        events.splice(index, 1);
        localStorage.setItem('events', JSON.stringify(events));
        renderEvents();
        showToast('Event removed');
      }
    }

    function showToast(message) {
      const toastEl = document.getElementById('successToast');
      document.getElementById('toastMessage').textContent = message;
      const toast = new bootstrap.Toast(toastEl);
      toast.show();
    }

    function logout() {
      if (confirm('Logout from Director mode?')) {
        localStorage.removeItem('isDirector');
        window.location.href = 'index.html';
      }
    }

    // Initialize
    renderAnnouncements();
    renderEvents();
  </script>
</body>
</html>
