<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Director Queries Management - RC Sports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .query-card { transition: all 0.3s; }
    .query-card:hover { transform: translateY(-3px); }
    .status-pending { background-color: #fff3cd; }
    .status-replied { background-color: #d4edda; }
    .sandbox-warning { background-color: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="home.html">
      <img src="pictures/Kagiso_Logo.jpg" alt="Kagiso Logo" style="max-height: 180px">RC Sports, Health & Wellness
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="admin-announcements.html">Announcements</a></li>
        <li class="nav-item"><a class="nav-link" href="admin-queries.html">Queries</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html" id="logout">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>
  
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-primary">Director Queries Management</h1>
      <button onclick="logout()" class="btn btn-outline-danger">Logout</button>
    </div>

    <div id="sandboxWarning" class="alert sandbox-warning text-center mb-4" style="display: none;">
      <strong>Note:</strong> Running in sandbox mode (e.g. preview). Data will not persist after refresh. 
      Open files directly in your browser for full localStorage support.
    </div>

    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">All Student Queries</h5>
      </div>
      <div class="card-body">
        <div id="queriesList" class="row g-3"></div>
      </div>
    </div>
  </div>

  <!-- Reply Modal -->
  <div class="modal fade" id="replyModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Reply to Query</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalQueryDetails" class="mb-3"></div>
          <textarea id="replyText" class="form-control" rows="5" placeholder="Type your reply here..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button onclick="sendReply()" class="btn btn-success">Send Reply</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    if (localStorage.getItem('isDirector') !== 'true') {
      window.location.href = 'index.html';
    }
    let storageAvailable = true;
    let memoryStorage = {};

    function safeGet(key) {
      if (storageAvailable) {
        try {
          return JSON.parse(localStorage.getItem(key) || '[]');
        } catch (e) {
          storageAvailable = false;
          document.getElementById('sandboxWarning').style.display = 'block';
        }
      }
      return memoryStorage[key] || [];
    }

    function safeSet(key, data) {
      if (storageAvailable) {
        try {
          localStorage.setItem(key, JSON.stringify(data));
          return;
        } catch (e) {
          storageAvailable = false;
          document.getElementById('sandboxWarning').style.display = 'block';
        }
      }
      memoryStorage[key] = data;
    }

    let queries = safeGet('queries');
    let currentReplyIndex = -1;

    function renderQueries() {
      const container = document.getElementById('queriesList');
      if (queries.length === 0) {
        container.innerHTML = `<div class="col-12"><div class="alert alert-info text-center">No queries submitted yet.</div></div>`;
        return;
      }

      container.innerHTML = queries.map((q, index) => `
        <div class="col-12">
          <div class="card query-card ${q.replied ? 'status-replied' : 'status-pending'}">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <h5 class="card-title">${q.subject}</h5>
                <span class="badge ${q.replied ? 'bg-success' : 'bg-warning text-dark'}">
                  ${q.replied ? 'Replied' : 'Pending'}
                </span>
              </div>
              <p class="text-muted mb-1">From: ${q.studentName} • ${new Date(q.date).toLocaleString('en-ZA')}</p>
              <p class="card-text">${q.message}</p>
              ${q.reply ? `<div class="alert alert-success mt-3"><strong>Director Reply:</strong><br>${q.reply}</div>` : ''}
            </div>
            <div class="card-footer">
              ${!q.replied ? `<button onclick="openReplyModal(${index})" class="btn btn-success btn-sm">Reply</button>` : ''}
              <button onclick="deleteQuery(${index})" class="btn btn-danger btn-sm">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openReplyModal(index) {
      currentReplyIndex = index;
      const q = queries[index];
      document.getElementById('modalQueryDetails').innerHTML = `
        <strong>Subject:</strong> ${q.subject}<br>
        <strong>Student:</strong> ${q.studentName}<br>
        <strong>Message:</strong> ${q.message}
      `;
      document.getElementById('replyText').value = q.reply || '';
      new bootstrap.Modal(document.getElementById('replyModal')).show();
    }

    function sendReply() {
      const reply = document.getElementById('replyText').value.trim();
      if (!reply) return alert("Please enter a reply");

      queries[currentReplyIndex].reply = reply;
      queries[currentReplyIndex].replied = true;
      safeSet('queries', queries);

      bootstrap.Modal.getInstance(document.getElementById('replyModal')).hide();
      renderQueries();
      alert("Reply sent successfully!");
    }

    function deleteQuery(index) {
      if (confirm("Delete this query permanently?")) {
        queries.splice(index, 1);
        safeSet('queries', queries);
        renderQueries();
      }
    }

    function logout() {
      if (confirm("Logout from Director mode?")) {
        safeSet('isDirector', null); // clear
        window.location.href = 'index.html';
      }
    }

    // Initialize
    renderQueries();
  </script>
</body>
</html>
